[package]
name = "bevy-studio-xtask"
version = "0.1.0"
edition = "2024"
description = "Reproducible orchestration for the vendored Jackdaw editor"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25.1", default-features = false, features = [
  "display",
  "parse",
] }
walkdir = "2"
xshell = "0.2"

[lints]
workspace = true
